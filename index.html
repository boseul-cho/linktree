<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="보슬의 채널과 육아·생활 추천 상품을 한곳에서 만나보세요." />
    <meta id="themeColor" name="theme-color" content="#f6f1e9" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="Boseul Cho" />
    <meta property="og:url" content="https://linktree-eta-nine.vercel.app/" />
    <meta property="og:title" content="보슬의 육아·생활 큐레이션" />
    <meta property="og:description" content="보슬의 채널과 육아·생활 추천 상품을 한곳에서 만나보세요." />
    <meta property="og:image" content="https://linktree-eta-nine.vercel.app/images/og-cover-warm.png" />
    <meta property="og:image:secure_url" content="https://linktree-eta-nine.vercel.app/images/og-cover-warm.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="보슬의 육아·생활 큐레이션" />
    <meta name="twitter:description" content="보슬의 채널과 육아·생활 추천 상품을 한곳에서 만나보세요." />
    <meta name="twitter:image" content="https://linktree-eta-nine.vercel.app/images/og-cover-warm.png" />
    <title>Boseul Cho | Linktree</title>
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="icon"
      href="https://avatars0.githubusercontent.com/boseul-cho"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
    />
    <script>
      (() => {
        const savedMode = localStorage.getItem("boseul-theme") || "auto";
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.themeMode = savedMode;
        document.documentElement.dataset.theme = savedMode === "auto" ? systemTheme : savedMode;
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>
    <div class="theme-switcher" role="group" aria-label="테마 선택">
      <button class="theme-option" type="button" data-theme-mode="auto" aria-label="시스템 설정 자동 적용">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2"></rect>
          <path d="M8 20h8M12 16v4"></path>
        </svg>
      </button>
      <button class="theme-option" type="button" data-theme-mode="light" aria-label="라이트 모드">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
      <button class="theme-option" type="button" data-theme-mode="dark" aria-label="다크 모드">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"></path>
        </svg>
      </button>
    </div>

    <a id="profilePicture" href="https://www.instagram.com/boseul_cho" target="_blank" rel="noopener noreferrer">
      <img
        src="https://avatars0.githubusercontent.com/boseul-cho"
        alt="Profile Picture"
      />
    </a>

    <header class="profile-header">
      <div id="userName">보슬의 큐레이션 노트</div>
      <p id="profileIntro">아이와 함께하는 매일을 조금 더 편안하게 만드는 것들</p>
    </header>

    <div class="logo-links">
      <a href="https://www.instagram.com/boseul_cho" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="images/instagram-icon.png" alt="Instagram" class="channel-logo" />
      </a>
      <a href="https://blog.naver.com/lily3091" target="_blank" rel="noopener noreferrer" aria-label="Naver Blog">
        <img src="images/naver-blog-icon.ico" alt="Naver Blog" class="channel-logo" />
      </a>
      <a href="https://ozip.me/VQHabEM?af" target="_blank" rel="noopener noreferrer" aria-label="오늘의집">
        <img src="images/ohouse-icon.ico" alt="오늘의집" class="channel-logo" />
      </a>
    </div>

    <form class="search-form" role="search" onsubmit="return false;">
      <label class="sr-only" for="productSearch">아이템 검색</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        id="productSearch"
        type="text"
        inputmode="search"
        placeholder="아이템명 · 추천 이유 · 번호로 찾아보세요"
        autocomplete="off"
      />
      <button id="clearSearch" class="clear-search" type="button" aria-label="검색어 지우기" hidden>×</button>
    </form>
    <p id="searchSummary" class="search-summary" aria-live="polite">17개의 큐레이션 아이템</p>

    <main id="productSections"></main>

    <div id="disclaimer">
      오늘의집 큐레이터 활동의 일환으로, 이에 따른 일정액의 수수료를 제공 받습니다.
    </div>

    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    
    <!-- Vercel Speed Insights -->
    <script type="module">
      import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@latest/dist/index.mjs';
      injectSpeedInsights();
    </script>
    
    <script src="app.js" defer></script>
  </body>
</html>
